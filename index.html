<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Chủ - Tổng Hợp Bài Tập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #222;
        }
        
        nav {
            background: #1e293b;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }
        
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            background: #334155;
        }
        
        nav a:hover {
            background: #0284c7;
        }
        
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 16px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        
        .card a {
            display: inline-block;
            margin-top: 8px;
            color: #0284c7;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Danh Sách Kết Quả Bài Tập</h1>
        <div class="grid">
            <div class="card">
                <img src="images/photo1.jpg" alt="Kết quả Đèn kéo quân">
                <h3>Đèn kéo quân (JS)</h3>
                <p>Hiệu ứng 6 hình ảnh quay tròn, hover để dừng/chạy.</p>
                <a href="denkeoquan.html">Xem trang →</a>
            </div>
            <!-- Tương tự tạo card + ảnh kết quả cho Bài 17 đến Bài 22 -->
            <div class="card">
                <img src="images/bai17.png" alt="Kết quả Bài 17">
                <h3>Bài tập 17</h3>
            </div>
            <div class="card">
                <img src="images/bai18.png" alt="Kết quả Bài 18">
                <h3>Bài tập 18</h3>
            </div>
            <div class="card">
                <img src="images/bai19.png" alt="Kết quả Bài 19">
                <h3>Bài tập 19</h3>
            </div>
        </div>
    </div>
</body>

</html>
